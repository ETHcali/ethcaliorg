<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos locales | ETH Cali</title>
    <meta name="description" content="Todos los eventos que ETH Cali ha organizado en Cali y la región desde 2022.">

    <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/faviconethcali38x38.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Eventos locales | ETH Cali">
    <meta property="og:description" content="Todos los eventos que ETH Cali ha organizado en Cali y la región desde 2022.">
    <meta property="og:image" content="https://ethcali.org/branding/Banner1200x400.png">
    <meta property="og:url" content="https://ethcali.org/events">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="preload" href="branding/fonts/web/SarunPro-Black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="branding/fonts/web/SarunPro-Book.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="css/site.css">
    <script src="js/navbar.js" defer></script>
</head>

<body>
    <div id="navbar-container"></div>

    <main>
        <header class="hero hero-compact">
            <div class="container">
                <div class="hero-content">
                    <span class="eyebrow">Eventos locales</span>
                    <h1>Nuestra historia</h1>
                    <p class="hero-subtitle" style="font-size: clamp(1.3rem, 2.4vw, 1.9rem);">en Cali y la región</p>
                    <p class="hero-description">Cada meetup, workshop y hackathon que hemos organizado desde que empezó la comunidad.</p>
                </div>
            </div>
        </header>

        <section id="metrics">
            <div class="container">
                <div class="section-header">
                    <span class="eyebrow">Números</span>
                    <h2>En cifras</h2>
                </div>
                <!-- Filled by js/events-ui.js from the CSVs in databases/. -->
                <div id="metrics-container"></div>
            </div>
        </section>

        <section id="list">
            <div class="container">
                <div class="section-header">
                    <span class="eyebrow">Historial</span>
                    <h2>Los eventos</h2>
                    <p>Filtra por fecha, o mira <a href="events_internationals.html">los internacionales</a>.</p>
                </div>


                <div class="filter-row" role="group" aria-label="Filtrar por año">
                    <button class="year-btn active" type="button" data-year="all" aria-pressed="true">Todos</button>
                    <button class="year-btn" type="button" data-year="2025" aria-pressed="false">2025</button>
                    <button class="year-btn" type="button" data-year="2024" aria-pressed="false">2024</button>
                    <button class="year-btn" type="button" data-year="2023" aria-pressed="false">2023</button>
                    <button class="year-btn" type="button" data-year="2022" aria-pressed="false">2022</button>
                </div>

                <div class="filter-row" role="group" aria-label="Filtrar por mes">
                    <button class="month-btn active" type="button" data-month="all" aria-pressed="true">Todos</button>
                    <button class="month-btn" type="button" data-month="0" aria-pressed="false">Enero</button>
                    <button class="month-btn" type="button" data-month="1" aria-pressed="false">Febrero</button>
                    <button class="month-btn" type="button" data-month="2" aria-pressed="false">Marzo</button>
                    <button class="month-btn" type="button" data-month="3" aria-pressed="false">Abril</button>
                    <button class="month-btn" type="button" data-month="4" aria-pressed="false">Mayo</button>
                    <button class="month-btn" type="button" data-month="5" aria-pressed="false">Junio</button>
                    <button class="month-btn" type="button" data-month="6" aria-pressed="false">Julio</button>
                    <button class="month-btn" type="button" data-month="7" aria-pressed="false">Agosto</button>
                    <button class="month-btn" type="button" data-month="8" aria-pressed="false">Septiembre</button>
                    <button class="month-btn" type="button" data-month="9" aria-pressed="false">Octubre</button>
                    <button class="month-btn" type="button" data-month="10" aria-pressed="false">Noviembre</button>
                    <button class="month-btn" type="button" data-month="11" aria-pressed="false">Diciembre</button>
                </div>

                <!-- Filled by js/events-ui.js. -->
                <div id="events-list" class="events-grid"></div>
            </div>
        </section>

    </main>

    <div id="footer-container"></div>

    <script src="js/events-service.js" defer></script>
    <script src="js/events-ui.js" defer></script>
    <script src="js/events-app.js" defer></script>
</body>
</html>
