<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venues | ETH Cali</title>
    <meta name="description" content="Los lugares de Cali donde ETH Cali ha organizado meetups, workshops y hackathons.">

    <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/faviconethcali38x38.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Venues | ETH Cali">
    <meta property="og:description" content="Los lugares de Cali donde ETH Cali ha organizado meetups, workshops y hackathons.">
    <meta property="og:image" content="https://ethcali.org/branding/Banner1200x400.png">
    <meta property="og:url" content="https://ethcali.org/venues">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="preload" href="branding/fonts/web/SarunPro-Black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="branding/fonts/web/SarunPro-Book.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Leaflet is vendored in js/vendor/ rather than pulled from a CDN. Its CSS
         loads before site.css so the brand overrides win the cascade. -->
    <link rel="stylesheet" href="js/vendor/leaflet.css">
    <link rel="stylesheet" href="css/site.css">
    <script src="js/navbar.js" defer></script>
</head>

<body>
    <div id="navbar-container"></div>

    <main>
        <header class="hero hero-compact">
            <div class="container">
                <div class="hero-content">
                    <span class="eyebrow">Dónde nos vemos</span>
                    <h1>Venues</h1>
                    <p class="hero-description">
                        Los lugares de Cali que nos han abierto sus puertas: gastrobares,
                        coworkings, universidades y oficinas aliadas.
                    </p>
                </div>
            </div>
        </header>

        <section id="venues">
            <div class="container">
                <div class="section-header">
                    <span class="eyebrow">Por tipo</span>
                    <h2>El mapa de la comunidad</h2>
                    <p>Toca un tipo para filtrar la lista.</p>
                </div>

                <div id="venues-map" class="venues-map"></div>
                <p class="faint" id="map-note" style="font-size:13px; margin-top:10px"></p>

                <!-- All filled by venues.js from databases/venuesethcali.csv. -->
                <div id="venue-stats" style="margin-top:32px"></div>
                <div class="filter-row" id="venue-filters" role="group" aria-label="Filtrar por tipo" style="margin-top:28px"></div>

                <div class="logo-grid" id="venues-container">
                    <div class="empty-state"><span class="spinner center"></span></div>
                </div>
            </div>
        </section>

    </main>

    <div id="footer-container"></div>

    <script src="js/vendor/leaflet.js" defer></script>
    <script src="venues.js" defer></script>
</body>
</html>
