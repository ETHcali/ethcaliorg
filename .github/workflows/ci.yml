# Runs on every pull request and on main, alongside the Vercel preview deploy.
#
# Three of the four checks CLAUDE.md calls mandatory run here: typecheck, the
# date and locale helper assertions, and lint. The fourth — `npm run build` —
# is the Vercel check on the same PR: it needs the Supabase anon key and the
# Dune fetch, both of which Vercel already has, and a preview URL is worth more
# than a green build log. A PR is mergeable when both are green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run lint
